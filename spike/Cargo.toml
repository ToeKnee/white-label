[package]
name = "spike"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone workspace root: the outer Leptos package has no [workspace] table,
# so this spike is fully isolated from the app being migrated.
[workspace]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dioxus = { version = "0.7.10", features = ["fullstack", "router"] }

dioxus-html = "0.7"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

# Server-only dependencies, following the optional-feature layout of the
# upstream Dioxus axum_session_auth example.
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8", optional = true, features = ["macros", "multipart"] }
# NOTE: the maintainer yanked almost the whole version history of this crate
# family in late 2026; only 0.20.x / 0.21.0 / 0.22.1 remain installable. The
# main app still resolves 0.16.0 because its Cargo.lock pins it (yanked
# versions stay downloadable for existing locks). Versions here are pinned to
# the newest that the resolver can pair with Dioxus' axum-core 0.5.
axum_session = { version = "0.20.1", optional = true }
axum_session_auth = { version = "0.20.0", features = ["advanced"], optional = true }
axum_session_sqlx = { version = "0.9.0", optional = true }
bcrypt = { version = "0.17", optional = true }
dashmap = { version = "6.1", optional = true }
dotenvy = { version = "0.15", optional = true }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "chrono"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version =  "0.6", features = ["fs"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
default = ["web", "server"]
server = [
    "dioxus/server",
    "dep:async-trait",
    "dep:axum",
    "dep:axum_session",
    "dep:axum_session_auth",
    "dep:axum_session_sqlx",
    "dep:bcrypt",
    "dep:dashmap",
    "dep:dotenvy",
    "dep:sqlx",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing-subscriber",
]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[dev-dependencies]
dioxus-ssr = "0.7"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
